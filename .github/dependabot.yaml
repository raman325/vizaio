---
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      # aioresponses must move in lockstep with aiohttp (it patches aiohttp
      # internals), so bump them in a single PR rather than racing each other.
      aiohttp:
        patterns:
          - aiohttp
          - aioresponses

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-config]
