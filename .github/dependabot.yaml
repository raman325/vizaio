---
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      # aioresponses must move in lockstep with aiohttp (it patches aiohttp
      # internals), so bump them in a single PR rather than racing each other.
      aiohttp:
        patterns:
          - aiohttp
          - aioresponses
    ignore:
      # Hold the dev cap at aiohttp<3.14: aioresponses 0.7.8 (latest) breaks on
      # aiohttp 3.14 (ClientResponse stream_writer; pnuckowski/aioresponses#289
      # still open). Remove this ignore and raise the cap together with the
      # grouped aioresponses bump once a 3.14-compatible aioresponses ships.
      - dependency-name: aiohttp
        versions: [">=3.14"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-config]
