---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync release version into pyproject.toml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' if present (we accept both `1.2.3` and `v1.2.3`).
          export VERSION="${REF_NAME#v}"
          echo "Publishing version ${VERSION}"
          uv pip install --system tomlkit
          python - <<'PY'
          import os
          import pathlib
          import tomlkit

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          doc = tomlkit.parse(path.read_text())
          doc["project"]["version"] = version
          path.write_text(tomlkit.dumps(doc))
          PY
      - name: Build sdist + wheel
        run: |
          uv pip install --system build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vizio-smartcast
    permissions:
      # PyPI Trusted Publisher: configure the PyPI project to trust
      # this repo + this workflow + the "pypi" environment.
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
